[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-json-repair-parser"
version = "0.1.0"
description = "Incrementally parses and auto-closes truncated streaming JSON tool-call payloads before stream completion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
streaming-json-repair-parser = "streaming_json_repair_parser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["streaming_json_repair_parser*"]
